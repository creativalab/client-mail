name: Build

# Pull requests: clippy + tests on Linux only (skipped for docs-only PRs).
# master and v* tags: optimized builds on Linux, Windows and macOS; tags also
# publish a GitHub Release with the binaries.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          # Anything besides docs, Markdown, agent definitions and the license is code.
          if echo "$changed" | grep -qvE '^(docs/|\.claude/)|\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  clippy:
    name: Lints (clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Debug build without debug info: much faster to compile than release.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked

  build:
    name: build (${{ matrix.os }}, ${{ matrix.name }}, ${{ matrix.bin }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ferrowl-linux-x86_64
            bin: ferrowl
          - os: windows-latest
            name: ferrowl-windows-x86_64
            bin: ferrowl.exe
          - os: macos-latest
            name: ferrowl-macos-arm64
            bin: ferrowl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} dist/
          cp README.md LICENSE dist/

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/

      - name: Release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.name }}.zip *
          else
            tar czf ../${{ matrix.name }}.tar.gz *
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.*
