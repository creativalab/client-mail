# Android app: Lint (warnings are errors), unit tests and a debug APK,
# including the Rust engine built with cargo-ndk.
# Runs only when the app or the engine changes.
name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - "core/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android (lint, tests, APK)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The runner's SDK may not have the platform the app compiles against.
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Lint, unit tests, debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./gradlew --no-configuration-cache :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: ferrowl-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
