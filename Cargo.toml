[package]
name = "ferrowl"
version = "0.2.0"
edition = "2024"
description = "Fast desktop email client written in Rust"
license = "MIT"
repository = "https://github.com/creativalab/client-mail"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
base64 = "0.22"
blitz-dom = { version = "0.3.0-beta.4", default-features = false, features = ["svg", "woff", "system-fonts"] }
blitz-html = "0.3.0-beta.4"
blitz-paint = "0.3.0-beta.4"
blitz-traits = "0.3.0-beta.4"
chrono = "0.4.45"
dirs = "7.0.0"
hayro = "0.8"
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced", "markdown"] }
imap = { version = "2.4.1", default-features = false }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
mail-parser = "1.0.0"
notify-rust = "4"
open = "5"
pgp = "0.21"
png = "0.18"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rand = "0.8"
rfd = "0.17.2"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
toml = "1.1.8"
ureq = "3"
webpki-roots = "1.0.11"

[profile.release]
strip = true
lto = "thin"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
