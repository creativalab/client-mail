[package]
name = "ferrowl-push"
version = "0.1.0"
edition = "2024"
description = "Ferrowl push relay: watches inboxes with IMAP IDLE and wakes the phone through Firebase Cloud Messaging"
license = "MIT"
publish = false

[dependencies]
# Server side: no system keychain.
ferrowl-core = { path = "../core", default-features = false }
aes-gcm = "0.10"
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
ureq = { version = "3", features = ["json"] }
zeroize = "1"
# APNs needs HTTP/2 (ureq has only HTTP/1.1); TLS through rustls with the
# ring provider installed at start-up, certificates from the system.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "json", "rustls-no-provider"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
