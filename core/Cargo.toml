[package]
name = "ferrowl-core"
version = "0.3.0"
edition = "2024"
description = "Ferrowl's engine: IMAP/POP3/SMTP, local cache and search, OpenPGP, translations"
license = "MIT"
repository = "https://github.com/creativalab/ferrowl"
publish = false

[features]
default = ["keychain"]
# Passwords in the system keychain (macOS, Windows, Linux Secret Service).
# Mobile apps turn it off and store secrets through the platform instead.
keychain = ["dep:keyring"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["unstable-locales"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
dirs = "7.0.0"
imap = { version = "2.4.1", default-features = false }
keyring = { optional = true, version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
mail-parser = "1.0.0"
pgp = "0.21"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rand = "0.8"
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
toml = "1.1.8"
ureq = "3"
webpki-roots = "1.0.11"
